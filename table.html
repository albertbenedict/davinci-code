<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da Vinci Code — table</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="table-page">
<nav>
  <span class="display nav-brand"><span class="nav-dot" aria-hidden="true"></span> Da Vinci Code</span>
  <span style="display:flex; gap:0.5rem; align-items:center;">
    <a href="index.html" class="btn-ghost" style="padding:0.45rem 0.85rem; font-size:0.88rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.3rem;">← Home</a>
    <button class="toggle" id="theme-toggle" aria-label="Toggle theme">Dark mode</button>
  </span>
</nav>

<main class="table-board">
  <div class="board-top">
    <section class="board-code card center room-share">
      <p class="muted" style="margin-bottom:0.35rem;">Share this room code</p>
      <div class="room-code-wrap">
        <div class="room-code" id="room-code">----</div>
        <button id="share-link-btn" class="btn-copy" aria-label="Share join link" title="Copy join link">↗ Share</button>
      </div>
      <p id="table-error" class="form-error hidden" style="margin-top:0.75rem; justify-content:center; flex-direction:column;"></p>
      <p id="table-conn" class="muted" style="font-size:0.82rem; margin-top:0.5rem; display:flex; align-items:center; justify-content:center; gap:0.4rem;"><span id="table-conn-dot" style="width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;"></span><span id="table-conn-text">Connecting…</span></p>
    </section>

    <section class="board-equipment card center" aria-label="Pile">
      <div class="card-head" style="margin-bottom:0.4rem; justify-content:center;"><h3 style="font-size:0.95rem;">Pile</h3></div>
      <div id="pile-counts" class="pile-counts">B — · W —</div>
      <p class="muted" style="font-size:0.78rem; margin-top:0.4rem;">24 tiles: B 0–11, W 0–11</p>
    </section>

    <section class="board-detonator card center" aria-label="Status">
      <div class="card-head" style="margin-bottom:0.4rem; justify-content:center;">
        <h3 style="font-size:0.95rem;">Status</h3>
        <span id="status-badge" class="badge badge--muted" style="margin-left:0.4rem;">Lobby</span>
      </div>
      <div id="turn-label" class="muted" style="font-size:0.85rem; text-align:center;">Waiting for players…</div>
    </section>
  </div>

  <section class="board-bottom" aria-label="Players">
    <div class="board-player-slot" data-slot="0"></div>
    <div class="board-player-slot" data-slot="1"></div>
    <div class="board-player-slot" data-slot="2"></div>
    <div class="board-player-slot" data-slot="3"></div>
  </section>

  <div class="board-actions">
    <button id="start-btn" class="btn-primary hidden">Start game</button>
    <div class="host-controls" aria-label="Host controls">
      <button id="reset-btn" class="btn-secondary btn-host hidden">↺ Reset to lobby</button>
      <button id="end-btn" class="btn-ghost hidden">End session</button>
    </div>
    <p id="host-hint" class="muted hidden" style="margin-top:0.5rem; font-size:0.8rem;">Reset keeps players but clears tiles. End deletes the room.</p>
    <div id="status" class="banner hidden"></div>
  </div>
</main>

<script type="module" src="js/table.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
